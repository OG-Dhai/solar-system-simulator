<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Interactive 3D Solar System simulation with realistic Keplerian orbits, planets, moons, asteroid belts, and Halley's Comet built with Three.js">
    <meta name="theme-color" content="#000005">
    <meta name="author" content="Solar System Simulation">
    <meta name="keywords" content="solar system, 3D simulation, Three.js, planets, astronomy, space, orbital mechanics">

    <title>Solar System Simulation | Interactive 3D Space Explorer</title>

    <!-- Favicon (simple circle instead of emoji) -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2300d4ff'/></svg>">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Skip to Content (Accessibility) -->

    <!-- Loading Screen -->
    <!-- Loading Screen -->
    <div id="loading-screen" role="status" aria-live="polite" aria-label="Loading Solar System">
        <div class="sun-loader-container">
            <div class="sun-loader-body">
                <div class="sun-liquid" id="sun-liquid"></div>
                <div class="sun-ray-ring"></div>
            </div>
            <div class="loader-text-group">
                <div class="loader-percentage" id="loader-percentage">0%</div>
                <div class="loader-status" id="loader-status">Initializing Star...</div>
            </div>
        </div>
    </div>

    <!-- Main UI Overlay -->
    <div id="ui-overlay" role="application" aria-label="Solar System Controls">
        <!-- Mission Control panel is dynamically generated by SolarSystemUI.js -->
        <!-- VR and Recording buttons are now inside the Mission Control panel -->
    </div>


    <!-- Main Application (Vite handles module resolution) -->
    <script type="module" src="/js/core/Main.js"></script>

    <!-- Loading screen is hidden by Main.js after assets load -->
</body>

</html>
